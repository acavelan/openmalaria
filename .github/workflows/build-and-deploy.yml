name: Capture pinned numerical baselines
on: [push, workflow_dispatch]
jobs:
  capture:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-26]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libgsl-dev libxerces-c-dev xsdcxx zlib1g-dev python3
      - if: startsWith(matrix.os, 'macos')
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install coreutils gsl xerces-c xsd
          HOMEBREW_NO_AUTO_UPDATE=1 brew link --overwrite xsd
      - name: Capture from pinned original sources
        run: bash unittest/golden-gen/build-goldens.sh "$RUNNER_TEMP/baseline"
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/baseline/rng_dist_v50.csv
            ${{ runner.temp }}/baseline/availability_percentiles.txt
            ${{ runner.temp }}/baseline/provenance.txt
          if-no-files-found: error
