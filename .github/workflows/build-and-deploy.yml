name: CI diagnostics
on: [push, workflow_dispatch]
jobs:
  diagnose:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: HOMEBREW_NO_AUTO_UPDATE=1 brew install gsl
      - name: Reproduce RNG relocation
        run: |
          c++ -O2 -g -std=c++20 -fsanitize=address,undefined -ffp-contract=off -I model -I unittest -I contrib $(gsl-config --cflags) -I"$(gsl-config --prefix)/include/gsl" unittest/golden-gen/rng_relocation.cpp model/util/errors.cpp $(gsl-config --libs) -o /tmp/rng-probe
          /tmp/rng-probe
